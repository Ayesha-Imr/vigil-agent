\* Approvals safety, deeper (MaxTime = 4, shutdown), with the TypedRefusedOverHttp fix, every rule. run.sh --deep.
SPECIFICATION Spec
SYMMETRY Symmetry
CONSTANTS
    Calls = {c1, c2}
    Hashes = {h1, h2}
    MaxApprovals = 3
    TTL = 2
    MaxTime = 4
    AllowHttpApprovals = FALSE
    AnyIdToConsume = TRUE
    Shutdown = TRUE
    TypedRefusedOverHttp = TRUE
INVARIANTS
    TypeOK
    NoUnapprovedExecution
    SingleUse
    DeniedNeverRuns
    ExpiredNeverRuns
    OwnerOnly
