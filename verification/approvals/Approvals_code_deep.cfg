\* Approvals safety, the code as it is, three approval rows (about 5.8M states, 5 min). run.sh --deep.
\* OwnerOnly, NoUnapprovedExecution and DeniedNeverRuns break here (findings/TypedApproveOverHttp.cfg: an HTTP-typed /approve
\* lands before the owner's Deny, which decide() then ignores); fixes/TypedRefusedOverHttp.cfg checks every rule with the fix.
SPECIFICATION Spec
SYMMETRY Symmetry
CONSTANTS
    Calls = {c1, c2}
    Hashes = {h1, h2}
    MaxApprovals = 3
    TTL = 2
    MaxTime = 3
    AllowHttpApprovals = FALSE
    AnyIdToConsume = TRUE
    Shutdown = FALSE
    TypedRefusedOverHttp = FALSE
INVARIANTS
    TypeOK
    SingleUse
    ExpiredNeverRuns
