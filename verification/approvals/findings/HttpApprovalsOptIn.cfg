\* FINDING (documented opt-in risk): channels.http.allowApprovals = true lets anything holding the HTTP token, the agent's tools included, approve.
\* expect: OwnerOnly
SPECIFICATION Spec
SYMMETRY Symmetry
CONSTANTS
    Calls = {c1, c2}
    Hashes = {h1, h2}
    MaxApprovals = 3
    TTL = 2
    MaxTime = 3
    AllowHttpApprovals = TRUE
    AnyIdToConsume = TRUE
    Shutdown = FALSE
INVARIANTS
    OwnerOnly
