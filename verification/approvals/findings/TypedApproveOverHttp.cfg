\* FINDING: a typed "/approve <id>" posted to the HTTP API (POST /api/message) reaches decide(): the allowApprovals refusal in Daemon.route only covers button presses. Anything holding the HTTP token, the agent's own tools included, can approve.
\* expect: OwnerOnly
SPECIFICATION Spec
SYMMETRY Symmetry
CONSTANTS
    Calls = {c1, c2}
    Hashes = {h1, h2}
    MaxApprovals = 3
    TTL = 2
    MaxTime = 3
    AllowHttpApprovals = FALSE
    AnyIdToConsume = TRUE
    Shutdown = FALSE
    TypedRefusedOverHttp = FALSE
INVARIANTS
    OwnerOnly
