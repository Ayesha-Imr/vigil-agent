\* Approvals safety with shutdown (Approvals.dispose()), every rule, smaller bound. Uses the TypedRefusedOverHttp fix so that OwnerOnly can be checked here. Run by verification/run.sh.
SPECIFICATION Spec
SYMMETRY Symmetry
CONSTANTS
    Calls = {c1, c2}
    Hashes = {h1, h2}
    MaxApprovals = 2
    TTL = 2
    MaxTime = 3
    AllowHttpApprovals = FALSE
    AnyIdToConsume = TRUE
    Shutdown = TRUE
    TypedRefusedOverHttp = TRUE
INVARIANTS
    TypeOK
    NoUnapprovedExecution
    SingleUse
    DeniedNeverRuns
    ExpiredNeverRuns
    OwnerOnly
