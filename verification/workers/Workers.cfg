\* Main check (expect: no error). Two tickets created in order 1, 2; workers.max = 1 plus
\* the reserved slot; two turns per run; up to 2 owner/concierge inputs; one crash; worker
\* tools ready and ask_owner; a turn ends ok, with a model error, or by the turn timeout.
SPECIFICATION Spec
CONSTANTS
    NT = 2
    MAX = 1
    TURNS = 2
    MaxInputs = 2
    MaxCrashes = 1
    ModelOutage = FALSE
    MaxFlips = 0
    ToolKinds = {"ready", "ask"}
    Outcomes = {"ok", "error", "timeout"}
INVARIANTS
    TypeOK
    NoDoubleRun
    SlotLimit
    ReservedSlotWorks
    StoppedRejectsInputs
CHECK_DEADLOCK FALSE
