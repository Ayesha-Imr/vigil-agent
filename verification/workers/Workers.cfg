\* Main safety check (expect: no error). Two tickets created in order 1, 2; workers.max = 1
\* plus the reserved slot; two turns per run; up to 2 owner/concierge inputs; no crash (see
\* WorkersCrash.cfg, WorkersDeep.cfg); worker tools ready and ask_owner; a turn ends ok or is cut
\* (a model error; a timeout takes the same branch of run()).
SPECIFICATION Spec
CONSTANTS
    NT = 2
    MAX = 1
    TURNS = 2
    MaxInputs = 2
    MaxCrashes = 0
    ModelOutage = FALSE
    MaxFlips = 0
    ToolKinds = {"ready", "ask"}
    Outcomes = {"ok", "error"}
INVARIANTS
    TypeOK
    NoDoubleRun
    SlotLimit
    ReservedSlotWorks
    StoppedStaysStopped
    InputKeptForTwoCuts
    RetriesBounded
    RetryBackoff
    InputNeverLostSilently
CHECK_DEADLOCK FALSE
