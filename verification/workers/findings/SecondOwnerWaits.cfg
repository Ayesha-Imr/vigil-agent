\* CHARACTERISATION (expect: Invariant SecondOwnerNeverWaits is violated). The reserved
\* slot is one slot: with max busy and two tickets holding owner input, the second waits
\* until some run ends. Three tickets, max = 1.
SPECIFICATION Spec
CONSTANTS
    NT = 3
    MAX = 1
    TURNS = 1
    MaxInputs = 2
    MaxCrashes = 0
    ModelOutage = FALSE
    MaxFlips = 0
    ToolKinds = {"ready"}
    Outcomes = {"ok"}
INVARIANTS
    SecondOwnerNeverWaits
CHECK_DEADLOCK FALSE
