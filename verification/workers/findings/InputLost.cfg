\* FINDING W3 (expect: Invariant InputNeverLost is violated).
\* A first turn that holds owner input and is cut (turn timeout, or a crash) leaves
\* tickets.session_file NULL; the next run starts a new session without that input.
SPECIFICATION Spec
CONSTANTS
    NT = 1
    MAX = 1
    TURNS = 2
    MaxInputs = 2
    MaxCrashes = 1
    ModelOutage = FALSE
    MaxFlips = 0
    ToolKinds = {"ready", "ask"}
    Outcomes = {"ok", "error", "timeout"}
INVARIANTS
    InputNeverLost
CHECK_DEADLOCK FALSE
