    NT = 2
    MAX = 1
    TURNS = 1
    MaxInputs = 1
    MaxCrashes = 0
    ModelOutage = FALSE
    MaxFlips = 0
    ToolKinds = {"ready", "ask"}
    Outcomes = {"ok", "error"}
PROPERTIES
    OwnerNeverStarved
    NoInputStuck
CHECK_DEADLOCK FALSE
