(* Chart bounds for /statechart: one ticket, one turn per run, one input, worker reports ready, turns end ok, no crash. *)
SPECIFICATION Spec
CONSTANTS
    NT = 1
    MAX = 1
    TURNS = 1
    MaxInputs = 1
    MaxCrashes = 0
    ModelOutage = FALSE
    MaxFlips = 0
    ToolKinds = {"ready"}
    Outcomes = {"ok"}
INVARIANTS
    NoDoubleRun
    SlotLimit
    StoppedRejectsInputs
    StoppedNeverRunsAgain
CHECK_DEADLOCK FALSE
