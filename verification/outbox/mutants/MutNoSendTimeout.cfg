\* Config for MutNoSendTimeout.tla: the comment at the top of that file names the code change and the expected result.
SPECIFICATION LiveSpecM
CONSTANTS
    Items <- MainItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 3
    MaxDrops = 1
    MaxTimeouts = 1
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = FALSE
    ChannelMayHang = TRUE
    AmbiguousFailures = FALSE
PROPERTIES
    NoLoss
CHECK_DEADLOCK FALSE  \* a hung pass stops everything: TLC must read it as stuttering forever, not stop at the deadlock
