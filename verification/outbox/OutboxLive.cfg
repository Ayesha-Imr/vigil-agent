\* Liveness: NoLoss under fairness; the channel may hang (the 90 s timeout rescues it); channel running. Expect: no error.
SPECIFICATION LiveSpec
CONSTANTS
    Items <- MainItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 3
    MaxDrops = 1
    MaxTimeouts = 1
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = FALSE
    ChannelMayHang = TRUE
    AmbiguousFailures = FALSE
PROPERTIES
    NoLoss
CHECK_DEADLOCK TRUE
