\* CHARACTERIZATION (expect: Temporal property NoLoss is violated). A channel that failed to start (daemon.ts:240) is gone until restart; its messages wait forever, by design (outbox.ts:119).
SPECIFICATION LiveSpec
CONSTANTS
    Items <- MainItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 0
    MaxDrops = 0
    MaxTimeouts = 0
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = TRUE
    ChannelMayHang = FALSE
    AmbiguousFailures = FALSE
PROPERTIES
    NoLoss
CHECK_DEADLOCK TRUE
