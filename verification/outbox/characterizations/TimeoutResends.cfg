\* CHARACTERIZATION (expect: Invariant AtMostOnceWithoutCrash is violated). A send slower than 90 s is abandoned and retried (outbox.ts:184-201) but not cancelled: if it lands, the owner gets the message twice, with no crash, and that copy has no message_refs row.
SPECIFICATION Spec
CONSTANTS
    Items <- MainItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 0
    MaxDrops = 0
    MaxTimeouts = 1
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = FALSE
    ChannelMayHang = FALSE
    AmbiguousFailures = FALSE
INVARIANTS
    AtMostOnceWithoutCrash
CHECK_DEADLOCK TRUE
