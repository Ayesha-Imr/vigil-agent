\* CHARACTERIZATION (expect: Invariant AtMostOnceWithoutCrashOrTimeout is violated). Residual of F2d, only where neither /proc nor ps works: the one send in flight across a suspend, when a second daemon takes over the stale lock and sends the same row, goes out twice.
SPECIFICATION Spec
CONSTANTS
    Items <- PairItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 1
    MaxDrops = 0
    MaxTimeouts = 0
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 2
    ProcFs = FALSE
    MaxStale = 1
    ChannelMayBeMissing = FALSE
    ChannelMayHang = FALSE
    AmbiguousFailures = FALSE
INVARIANTS
    AtMostOnceWithoutCrashOrTimeout
CHECK_DEADLOCK TRUE
