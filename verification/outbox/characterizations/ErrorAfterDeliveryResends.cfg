\* CHARACTERIZATION (expect: Invariant AtMostOnceWithoutCrashOrTimeout is violated). If channel.send throws after the message went out (Discord failing on its second chunk), the outbox retries and the owner gets it twice, with no crash.
SPECIFICATION Spec
CONSTANTS
    Items <- MainItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 1
    MaxDrops = 0
    MaxTimeouts = 0
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = FALSE
    ChannelMayHang = FALSE
    AmbiguousFailures = TRUE
INVARIANTS
    AtMostOnceWithoutCrashOrTimeout
CHECK_DEADLOCK TRUE
