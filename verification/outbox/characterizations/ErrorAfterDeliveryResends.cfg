\* CHARACTERIZATION (expect: Invariant AtMostOnceWithoutCrash is violated). If channel.send throws after the message went out (a timeout after Telegram accepted it, a Discord send that fails on its second chunk), the outbox retries and the owner gets it twice, with no crash.
SPECIFICATION Spec
CONSTANTS
    Items <- MainItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 1
    MaxDrops = 0
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 1
    ChannelMayBeMissing = FALSE
    AmbiguousFailures = TRUE
INVARIANTS
    AtMostOnceWithoutCrash
CHECK_DEADLOCK TRUE
