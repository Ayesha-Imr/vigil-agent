\* CHARACTERIZATION (expect: Invariant EveryCopyRoutable is violated). The copy that went out just before a crash never gets a message_refs row; a reply to that copy is not routed to its ticket.
SPECIFICATION Spec
CONSTANTS
    Items <- MainItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 0
    MaxDrops = 0
    MaxTimeouts = 0
    MaxCrashes = 1
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = FALSE
    ChannelMayHang = FALSE
    AmbiguousFailures = FALSE
INVARIANTS
    EveryCopyRoutable
CHECK_DEADLOCK TRUE
