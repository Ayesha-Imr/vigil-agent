\* CHARACTERIZATION (expect: Invariant SplitPartsNoGap is violated). When part 1 of a long message is dropped (PermanentSendError), part 2 still goes out: the owner gets the message without its start.
SPECIFICATION Spec
CONSTANTS
    Items <- MainItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 0
    MaxDrops = 1
    MaxTimeouts = 0
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = FALSE
    ChannelMayHang = FALSE
    AmbiguousFailures = FALSE
INVARIANTS
    SplitPartsNoGap
CHECK_DEADLOCK TRUE
