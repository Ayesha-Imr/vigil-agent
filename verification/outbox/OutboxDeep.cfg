\* check.sh --deep: four transient errors. Expect: no error.
SPECIFICATION Spec
CONSTANTS
    Items <- MainItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 4
    MaxDrops = 1
    MaxTimeouts = 1
    MaxCrashes = 1
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = TRUE
    ChannelMayHang = TRUE
    AmbiguousFailures = FALSE
INVARIANTS
    TypeOK
    OrderPreserved
    SplitPartsInOrder
    TicketMessagesInOrder
    AtMostOnceWithoutCrashOrTimeout
    RefRecorded
CHECK_DEADLOCK TRUE
