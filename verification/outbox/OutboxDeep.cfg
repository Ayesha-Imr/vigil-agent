\* check.sh --deep: five rows (adds the ticket's question), two crashes. About 4 million states, ~2 min. Expect: no error.
SPECIFICATION Spec
CONSTANTS
    Items <- DeepItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 4
    MaxDrops = 1
    MaxCrashes = 2
    MaxPasses = 2
    Daemons = 1
    ChannelMayBeMissing = TRUE
    AmbiguousFailures = FALSE
INVARIANTS
    TypeOK
    OrderPreserved
    SplitPartsInOrder
    AtMostOnceWithoutCrash
    RefRecorded
CHECK_DEADLOCK TRUE
