\* FINDING F1c (expect: Invariant TicketMessagesInOrder is violated). A ticket's helper session (delegate.ts:30-39) has no ticketId, so its approval ask has no order key and overtakes the ticket's question when that send fails once (if the ticket's chat is the owner's main chat).
SPECIFICATION Spec
CONSTANTS
    Items <- HelperItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 1
    MaxDrops = 0
    MaxTimeouts = 0
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = FALSE
    ChannelMayHang = FALSE
    AmbiguousFailures = FALSE
INVARIANTS
    TicketMessagesInOrder
CHECK_DEADLOCK TRUE
