\* FINDING F2d (expect: Invariant AtMostOnceWithoutCrashOrTimeout is violated). Without /proc (macOS) lockHolderAlive trusts the heartbeat only: after a suspend it looks stale, a second daemon takes the lock while the first still has a send in flight (or rows left in its pass snapshot: mayDeliver is read at pass start only), and both send the row.
SPECIFICATION Spec
CONSTANTS
    Items <- PairItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 1
    MaxDrops = 0
    MaxTimeouts = 0
    MaxCrashes = 0
    MaxPasses = 2
    Daemons = 2
    ProcFs = FALSE
    MaxStale = 1
    ChannelMayBeMissing = FALSE
    ChannelMayHang = FALSE
    AmbiguousFailures = FALSE
INVARIANTS
    AtMostOnceWithoutCrashOrTimeout
CHECK_DEADLOCK TRUE
