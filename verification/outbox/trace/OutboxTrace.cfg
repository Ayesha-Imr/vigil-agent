\* Trace validation of the outbox: recorded runs of src/core/outbox.ts against Outbox.tla.
\* check.sh runs it on a generated module OutboxTraceBatch (EXTENDS OutboxTrace) that defines
\* BatchFiles (a tuple of trace paths, one scenario) and BatchResultDir.
\* Items comes from the traces' header. BLOCKING_ATTEMPTS and MaxPasses must equal record.ts's
\* BLOCKING and SLOTS. The budgets are out of reach: a trace has as many errors, drops, timeouts
\* and crashes as the recorder chose. One daemon (the lock is not traced); a channel may be
\* missing per lifetime; the channel never throws after delivering (record.ts does not do it).
SPECIFICATION TraceSpec
CONSTANTS
    TraceFiles <- BatchFiles
    ResultDir <- BatchResultDir
    Items <- TraceItems
    BLOCKING_ATTEMPTS = 3
    MaxFails = 1000
    MaxDrops = 1000
    MaxTimeouts = 1000
    MaxCrashes = 1000
    MaxPasses = 2
    Daemons = 1
    ProcFs = TRUE
    MaxStale = 0
    ChannelMayBeMissing = TRUE
    ChannelMayHang = TRUE
    AmbiguousFailures = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    Accepted
    TypeOK
    OrderPreserved
    SplitPartsInOrder
    TicketMessagesInOrder
    AtMostOnceWithoutCrashOrTimeout
    RefRecorded
