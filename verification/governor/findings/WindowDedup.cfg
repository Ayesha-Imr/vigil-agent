\* FINDING: dedupWindowMinutes above 7 days: tick() forgets resolved notices after HISTORY_MS, so dedup misses (MCLongWindowPolicies).
\* expect: NoDuplicate
SPECIFICATION Spec
VIEW View
SYMMETRY Symmetry
CONSTANTS
    N = 2
    Topics = {t1}
    Keys = {k1, k2}
    D = 3
    Policies <- MCLongWindowPolicies
    MaxTime = 4
    MuteFor = {1, 3}
    PenaltySlots = 21
    HistorySlots = 1
    CustomExpiry = {}
    Feedback = FALSE
    Concierge = FALSE
    ReplyOutcomes = {"stored", "partial", "none"}
    ClaimOnPeek = FALSE
INVARIANTS
    NoDuplicate
