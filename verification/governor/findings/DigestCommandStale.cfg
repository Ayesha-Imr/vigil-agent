\* FINDING: not a DESIGN.md rule: /digest (takeForReply) does not expire first, so a notice past expiresAt can be told in the up-to-30-s window before the next tick.
\* expect: NoStaleDelivery
SPECIFICATION Spec
VIEW View
SYMMETRY Symmetry
CONSTANTS
    N = 2
    Topics = {t1}
    Keys = {k1, k2}
    D = 3
    Policies <- MCPolicies
    MaxTime = 4
    MuteFor = {1, 3}
    PenaltySlots = 21
    HistorySlots = 21
    CustomExpiry = {}
    Feedback = TRUE
    Concierge = FALSE
    ReplyOutcomes = {"stored", "partial", "none"}
    ClaimOnPeek = FALSE
INVARIANTS
    NoStaleDelivery
