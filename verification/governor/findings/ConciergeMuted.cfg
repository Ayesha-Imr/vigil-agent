\* FINDING: the owner mutes a topic while the concierge's turn runs; the stored reply still tells the muted notice.
\* expect: NoMuted
SPECIFICATION Spec
VIEW View
SYMMETRY Symmetry
CONSTANTS
    N = 2
    Topics = {t1}
    Keys = {k1, k2}
    D = 3
    Policies <- MCPolicies
    MaxTime = 4
    MuteFor = {1, 3}
    PenaltySlots = 21
    HistorySlots = 21
    CustomExpiry = {}
    Feedback = TRUE
    Concierge = TRUE
    ReplyOutcomes = {"stored", "none"}
    ClaimOnPeek = FALSE
INVARIANTS
    NoMuted
