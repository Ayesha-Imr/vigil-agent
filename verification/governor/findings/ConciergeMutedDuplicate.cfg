\* FINDING: a notice dropped by a mute during the turn is told by the reply; offer()'s dedup ignores dropped notices, so the same news goes out again after unmute.
\* expect: NoDuplicate
SPECIFICATION Spec
VIEW View
SYMMETRY Symmetry
CONSTANTS
    N = 2
    Topics = {t1}
    Keys = {k1, k2}
    D = 3
    Policies <- MCPolicies
    MaxTime = 4
    MuteFor = {1, 3}
    PenaltySlots = 21
    HistorySlots = 21
    CustomExpiry = {}
    Feedback = TRUE
    Concierge = TRUE
    ReplyOutcomes = {"stored", "none"}
    ClaimOnPeek = FALSE
INVARIANTS
    NoDuplicate
