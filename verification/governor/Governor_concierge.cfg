\* Governor safety with the concierge reply path (concierge.ts peek, reply, confirmDelivered), no owner feedback.
\* Conservation and NoMuted break on this path; they are checked in findings/Concierge*.cfg.
SPECIFICATION Spec
VIEW View
SYMMETRY Symmetry
CONSTANTS
    N = 2
    Topics = {t1}
    Keys = {k1, k2}
    D = 3
    Policies <- MCPolicies
    MaxTime = 4
    MuteFor = {1, 3}
    PenaltySlots = 21
    HistorySlots = 21
    CustomExpiry = {}
    Feedback = FALSE
    Concierge = TRUE
    ReplyOutcomes = {"stored", "partial", "none"}
    ClaimOnPeek = FALSE
INVARIANTS
    TypeOK
    Budget
    CriticalCap
    Quiet
    NoDuplicate
PROPERTIES
    FinalStable
