\* Governor safety, deeper: callers may set their own expiresAt. Not run by run.sh; run.sh --deep.
SPECIFICATION Spec
VIEW View
SYMMETRY Symmetry
CONSTANTS
    N = 2
    Topics = {t1}
    Keys = {k1, k2}
    D = 3
    Policies <- MCPolicies
    MaxTime = 4
    MuteFor = {1, 3}
    PenaltySlots = 21
    HistorySlots = 21
    CustomExpiry = {1}
    Feedback = TRUE
    Concierge = FALSE
    ReplyOutcomes = {"stored", "partial", "none"}
    ClaimOnPeek = FALSE
INVARIANTS
    TypeOK
    Budget
    CriticalCap
    Quiet
    NoMuted
    NoDuplicate
    Conservation
PROPERTIES
    FinalStable
