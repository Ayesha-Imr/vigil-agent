\* Trace validation of the governor: recorded runs of src/core/governor.ts against Governor.tla.
\* check.sh runs it on a generated module GovernorTraceBatch (EXTENDS GovernorTrace) that defines
\* BatchFiles (a tuple of trace paths) and BatchResultDir.
\* MaxTime must equal record.ts MAX_TIME; N, the policies (one of MCPolicies) come from the traces.
SPECIFICATION TraceSpec
CONSTANTS
    TraceFiles <- BatchFiles
    ResultDir <- BatchResultDir
    N <- TraceN
    Topics <- TraceTopics
    Keys <- TraceKeys
    D = 3
    Policies <- MCPolicies
    MaxTime = 30
    MuteFor = {1, 2, 3, 6}
    PenaltySlots = 21
    HistorySlots = 21
    CustomExpiry <- TraceCustomExpiry
    Feedback = TRUE
    Concierge = TRUE
    ReplyOutcomes = {"stored", "partial", "none"}
CHECK_DEADLOCK FALSE
INVARIANTS
    Accepted
    TypeOK
    Budget
    CriticalCap
    Quiet
    NoMuted
    NoDuplicate
    Conservation
    NoStaleDelivery
PROPERTIES
    FinalStable
