\* SUGGESTED FIX, modeled: the concierge claims the notices it shows (ClaimOnPeek), no owner feedback. Must pass.
\* NoMuted is left out on purpose: findings/ConciergeMutedAfterFix.cfg shows the residual (a mute during the turn cannot unsay a reply).
SPECIFICATION Spec
VIEW View
SYMMETRY Symmetry
CONSTANTS
    N = 2
    Topics = {t1}
    Keys = {k1, k2}
    D = 3
    Policies <- MCPolicies
    MaxTime = 4
    MuteFor = {1, 3}
    PenaltySlots = 21
    HistorySlots = 21
    CustomExpiry = {}
    Feedback = FALSE
    Concierge = TRUE
    ReplyOutcomes = {"stored", "partial", "none"}
    ClaimOnPeek = TRUE
INVARIANTS
    TypeOK
    Budget
    CriticalCap
    Quiet
    NoDuplicate
    Conservation
PROPERTIES
    FinalStable
