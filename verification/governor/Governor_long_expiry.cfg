\* Governor safety when notices may wait longer than HISTORY_MS (the notify tool's expires_in_hours has no cap): HistorySlots = 1 < expiry, with the concierge path. Every rule. Was finding ClaimPruned (fixed in 4d5f2c7). Run by verification/run.sh.
SPECIFICATION Spec
VIEW View
CONSTANTS
    N = 2
    Topics = {t1}
    Keys = {k1, k2}
    D = 3
    Policies <- LongExpiryPolicies
    MaxTime = 4
    MuteFor = {1, 3}
    PenaltySlots = 21
    HistorySlots = 1
    CustomExpiry = {}
    Feedback = FALSE
    Concierge = TRUE
    ReplyOutcomes = {"stored", "none"}
INVARIANTS
    TypeOK
    Budget
    CriticalCap
    Quiet
    NoMuted
    NoDuplicate
    Conservation
    NoStaleDelivery
PROPERTIES
    FinalStable
