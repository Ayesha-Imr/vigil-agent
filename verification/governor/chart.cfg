\* Tiny config for drawing the governor with the pstack /statechart skill: one notice, one policy.
\* Not a verification config (run.sh does not run it).
SPECIFICATION Spec
VIEW View
CONSTANTS
    N = 1
    Topics = {t1}
    Keys = {k1}
    D = 3
    Policies <- ChartPolicies
    MaxTime = 3
    MuteFor = {3}
    PenaltySlots = 21
    HistorySlots = 21
    CustomExpiry = {}
    Feedback = FALSE
    Concierge = FALSE
    ReplyOutcomes = {"none"}
INVARIANTS
    Budget
    CriticalCap
    Quiet
    NoMuted
    NoDuplicate
    Conservation
