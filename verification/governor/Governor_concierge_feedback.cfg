\* Governor safety with the concierge path and owner feedback (mutes during a turn). "partial" acts as "stored" in the code, so it is left out. Every rule. run.sh --deep.
SPECIFICATION Spec
VIEW View
SYMMETRY Symmetry
CONSTANTS
    N = 2
    Topics = {t1}
    Keys = {k1, k2}
    D = 3
    Policies <- MCPolicies
    MaxTime = 4
    MuteFor = {1, 3}
    PenaltySlots = 21
    HistorySlots = 21
    CustomExpiry = {}
    Feedback = TRUE
    Concierge = TRUE
    ReplyOutcomes = {"stored", "none"}
INVARIANTS
    TypeOK
    Budget
    CriticalCap
    Quiet
    NoMuted
    NoDuplicate
    Conservation
    NoStaleDelivery
PROPERTIES
    FinalStable
