\* Runs may outlive RUN_LEASE_MS, one crash (expect: no error): overlap only after the lease.
SPECIFICATION Spec
CONSTANTS
    EveryJobs = {heartbeat}
    AtJobs = {reminder}
    Period = 2
    AtTime = 3
    LEASE = 3
    MaxAge = 20
    MaxT = 14
    MaxCrashes = 1
    RunsOutliveLease = TRUE
INVARIANTS
    OverlapOnlyAfterLease
    OneTriggerPerSlot
    AtJobsFireOnce
    NoLostSlot
CHECK_DEADLOCK FALSE
