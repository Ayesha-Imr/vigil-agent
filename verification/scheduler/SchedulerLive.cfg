\* Liveness without crashes: every claimed run finishes and the "at" job runs.
SPECIFICATION Spec
CONSTANTS
    EveryJobs = {heartbeat}
    AtJobs = {reminder}
    Period = 2
    AtTime = 3
    LEASE = 3
    MaxT = 14
    MaxCrashes = 0
    RunsOutliveLease = FALSE
INVARIANTS
    TypeOK
    OneTriggerPerSlot
    NoOverlap
    AtJobsFireOnce
PROPERTIES
    ClaimedRunCompletes
    AtJobRuns
CHECK_DEADLOCK FALSE
