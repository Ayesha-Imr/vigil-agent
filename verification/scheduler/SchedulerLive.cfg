\* Liveness with a crash (expect: no error): every claimed run finishes, the "at" job runs.
SPECIFICATION Spec
CONSTANTS
    EveryJobs = {heartbeat}
    AtJobs = {reminder}
    Period = 2
    AtTime = 3
    LEASE = 3
    MaxAge = 20
    MaxT = 12
    MaxCrashes = 1
    RunsOutliveLease = FALSE
PROPERTIES
    ClaimedRunCompletes
    AtJobRuns
CHECK_DEADLOCK FALSE
