\* CHARACTERISATION (expect: Invariant NoOverlap is violated). By design: when a
\* run outlives RUN_LEASE_MS, claimDue presumes it dead and starts another.
SPECIFICATION Spec
CONSTANTS
    EveryJobs = {heartbeat}
    AtJobs = {reminder}
    Period = 2
    AtTime = 3
    LEASE = 3
    MaxT = 9
    MaxCrashes = 0
    RunsOutliveLease = TRUE
INVARIANTS
    NoOverlap
CHECK_DEADLOCK FALSE
