\* FINDING S2 (expect: Invariant OverlapOnlyAfterLease is violated).
\* A run outlives RUN_LEASE_MS, the job is re-claimed, then the OLD run's
\* complete() frees the job while the new run is still going.
SPECIFICATION Spec
CONSTANTS
    EveryJobs = {heartbeat}
    AtJobs = {reminder}
    Period = 2
    AtTime = 3
    LEASE = 3
    MaxT = 9
    MaxCrashes = 0
    RunsOutliveLease = TRUE
INVARIANTS
    OverlapOnlyAfterLease
CHECK_DEADLOCK FALSE
