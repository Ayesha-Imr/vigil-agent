\* Main check: every property that the code at the sync commit must keep.
\* One "every" job (the heartbeat) and one "at" job (a reminder), two crashes,
\* runs finish within RUN_LEASE_MS.
SPECIFICATION Spec
CONSTANTS
    EveryJobs = {heartbeat}
    AtJobs = {reminder}
    Period = 2
    AtTime = 3
    LEASE = 3
    MaxT = 14
    MaxCrashes = 2
    RunsOutliveLease = FALSE
INVARIANTS
    TypeOK
    OneTriggerPerSlot
    NoOverlap
    AtJobsFireOnce
CHECK_DEADLOCK FALSE
