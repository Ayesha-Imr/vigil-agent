\* Main check (expect: no error). One "every" job (the heartbeat) and one "at" job (a
\* reminder), two crashes, runs finish within RUN_LEASE_MS, replay window longer than the run.
SPECIFICATION Spec
CONSTANTS
    EveryJobs = {heartbeat}
    AtJobs = {reminder}
    Period = 2
    AtTime = 3
    LEASE = 3
    MaxAge = 20
    MaxT = 14
    MaxCrashes = 2
    RunsOutliveLease = FALSE
INVARIANTS
    TypeOK
    OneTriggerPerSlot
    NoOverlap
    NoLostSlot
    AtJobsFireOnce
CHECK_DEADLOCK FALSE
